name: ios-submit-existing

# Recover metadata/submission failures without rebuilding or uploading an existing IPA.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing iOS marketing version (for example 2.6.0)."
        required: true
        type: string
      build_number:
        description: "Exact already-uploaded build number. Must be VALID in this version."
        required: true
        type: string
      automatic_release:
        description: "Release automatically after App Review approves."
        type: boolean
        default: true
      distribute_testflight:
        description: "Also submit this version to the existing TestFlight public group."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-submit-existing-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate requested version, build and metadata
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          bash scripts/check-release-version.sh "$VERSION"
          python3 scripts/test-appstore-content.py
          python3 scripts/check-appstore-content.py --metadata-only

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install fastlane --no-document

      - name: Stage App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_P8" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer_id "$ASC_ISSUER_ID" \
            --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_api_key.json"

      - name: Protect other versions, verify age rating and exact processed build
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ruby scripts/check-appstore-version.rb
          ruby scripts/check-appstore-age-rating.rb
          ruby <<'RUBY'
          require "spaceship"
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch("ASC_KEY_ID"), issuer_id: ENV.fetch("ASC_ISSUER_ID"),
            filepath: File.join(ENV.fetch("RUNNER_TEMP"), "AuthKey.p8"),
          )
          app = Spaceship::ConnectAPI::App.find("com.panda.ccpocket") or abort("ASC app not found")
          ready = false
          60.times do |attempt|
            builds = app.get_builds(filter: {
              version: ENV.fetch("BUILD_NUMBER"), "preReleaseVersion.version" => ENV.fetch("VERSION")
            }, sort: "-uploadedDate")
            abort("Multiple matching builds; no submission made") if builds.length > 1
            state = builds.first&.processing_state || "NOT_VISIBLE"
            puts "Build #{ENV.fetch('VERSION')} (#{ENV.fetch('BUILD_NUMBER')}): #{state} (#{attempt + 1}/60)"
            $stdout.flush
            if state == "VALID"
              ready = true
              break
            end
            abort("Build processing failed: #{state}; no submission made") unless ["PROCESSING", "NOT_VISIBLE"].include?(state)
            sleep 30 unless attempt == 59
          end
          abort("Timed out waiting for exact VALID build; no submission made") unless ready
          puts "Existing build #{ENV.fetch('VERSION')} (#{ENV.fetch('BUILD_NUMBER')}): VALID"
          RUBY

      - name: Submit existing build with current metadata
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          AUTO_RELEASE: ${{ inputs.automatic_release }}
        run: |
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_version "$VERSION" --build_number "$BUILD_NUMBER" \
            --skip_binary_upload true --skip_screenshots true \
            --submit_for_review true --automatic_release "$AUTO_RELEASE"

      - name: Read back version, build, metadata and release mode
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          METADATA_PATH: fastlane/metadata
          EXPECTED_RELEASE_TYPE: ${{ inputs.automatic_release && 'AFTER_APPROVAL' || 'MANUAL' }}
        run: ruby scripts/verify-appstore-metadata.rb

  testflight:
    if: ${{ inputs.distribute_testflight }}
    needs: submit
    uses: ./.github/workflows/testflight-public-link.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
