name: ci

# PR gate: one cheap ubuntu job — run the protocol / daemon / relay test suites and
# compile the desktop target and assemble the Android APK. Mobile UI tests (desktopTest) stay local
# (scripts/check-all.sh): they exercise a real Skia renderer and are not stable on
# headless CI runners. Release pipelines are separate dispatch-only workflows
# (release.yml / ios-release.yml / build-windows.yml).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msi-branding:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check MSI branding against native Windows Installer fixtures
        shell: powershell
        run: scripts/test-brand-windows-msi.ps1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Verify support knowledge and generated manual
        run: |
          python3 scripts/check-firebase-placeholders.py
          python3 scripts/check-brand-compatibility.py
          python3 scripts/check-production-caddy.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s support/tests -v
          node --test support/openclaw/plugins/cc-pocket-support-guard/index.test.js
          bash -n scripts/activate-openclaw-support-channel.sh
          bash scripts/activate-openclaw-support-channel.sh --help
          python3 scripts/build-manual.py
          python3 scripts/check-site-seo.py
          python3 scripts/check-public-content.py
          git diff --exit-code -- site/manual site/sitemap.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The KMP Android targets need an SDK; the Android host APK uses a placeholder Firebase config.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Use the placeholder google-services.json
        run: cp mobile/androidApp/google-services.json.template mobile/androidApp/google-services.json

      - name: Test observability · protocol · daemon · relay, compile mobile (desktop and Android)
        run: ./gradlew --no-daemon :observability:jvmTest :observability-sentry:jvmTest :protocol:jvmTest :daemon:test :relay:test :mobile:composeApp:compileKotlinDesktop :mobile:androidApp:assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # issue #302: the Windows external-writer cwd probe (ProcessCwd's PEB walk) is a BLIND port — no
  # Windows machine was available while writing it. This job runs the daemon's Windows-only tests on a
  # real windows-latest runner so the PEB offsets self-verify (ProcessCwd.selfCheck reads THIS process's
  # cwd and compares user.dir). A red here is the "user feedback" loop, mechanized: it means the blind
  # offsets are wrong and the fallback must stay UNKNOWN. Non-blocking on the required `test` job.
  windows-cwd-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Parse the Windows installer
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Daemon Windows cwd probe and CLI compatibility
        run: ./gradlew --no-daemon :daemon:test --tests "*WinCwd*" --tests "*CliAliasesTest"
