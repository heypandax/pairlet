name: ios-store-metadata

# Creates or updates an editable App Store version and syncs localized metadata + screenshots + previews.
# No binary is uploaded, no build is attached, and the version is never submitted for review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Editable App Store version to create or update (for example 2.0.0)."
        required: true
        type: string
      verify_only:
        description: "Read back the existing store media without changing metadata or uploading anything."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-store-metadata-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and store content
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be x.y.z, got: $VERSION"
            exit 1
          fi
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 scripts/check-appstore-content.py

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Test screenshot verification
        run: ruby scripts/test-appstore-screenshot-state.rb
      - run: gem install fastlane --no-document

      - name: Stage App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::App Store Connect API secrets are not set."
            exit 1
          fi
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer_id "$ASC_ISSUER_ID" \
                --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
                '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
                > "$RUNNER_TEMP/asc_api_key.json"

      - name: Stage store-page metadata only
        if: ${{ !inputs.verify_only }}
        # Release notes are managed by ios-release, which attaches the matching binary.
        run: |
          for locale in en-US zh-Hans; do
            mkdir -p "$RUNNER_TEMP/store-metadata/$locale"
            cp "fastlane/metadata/$locale/name.txt" \
               "fastlane/metadata/$locale/description.txt" \
               "fastlane/metadata/$locale/keywords.txt" \
               "fastlane/metadata/$locale/promotional_text.txt" \
               "fastlane/metadata/$locale/marketing_url.txt" \
               "fastlane/metadata/$locale/support_url.txt" \
               "fastlane/metadata/$locale/privacy_url.txt" \
               "$RUNNER_TEMP/store-metadata/$locale/"
          done

      - name: Create or update App Store version ${{ inputs.version }}
        if: ${{ !inputs.verify_only }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_version "$VERSION" \
            --metadata_path "$RUNNER_TEMP/store-metadata" \
            --skip_binary_upload true \
            --skip_screenshots true \
            --skip_metadata false \
            --submit_for_review false \
            --force true

      - name: Converge iPhone and iPad screenshot sets
        if: ${{ !inputs.verify_only }}
        env:
          VERSION: ${{ inputs.version }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: ruby scripts/sync-appstore-screenshots.rb

      - name: Replace localized App Previews after processing
        if: ${{ !inputs.verify_only }}
        env:
          VERSION: ${{ inputs.version }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: ruby scripts/sync-appstore-previews.rb

      - name: Verify iPhone and iPad media
        env:
          VERSION: ${{ inputs.version }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: ruby scripts/verify-appstore-media.rb

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          {
            echo "## App Store media verified"
            echo "- Version: $VERSION"
            echo "- Locales: en-US, zh-Hans"
            echo "- Screenshots: 6 per locale per device family (iPhone 6.5-inch + iPad 12.9-inch)"
            echo "- App Previews: 1 per locale"
            echo "- Read-only verification: $VERIFY_ONLY"
            echo "- Binary uploaded: no"
            echo "- Submitted for review: no"
          } >> "$GITHUB_STEP_SUMMARY"
