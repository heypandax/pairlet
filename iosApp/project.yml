name: iosApp
options:
  bundleIdPrefix: com.panda
  deploymentTarget:
    iOS: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "8.58.2"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Sentry
        product: Sentry
    settings:
      base:
        # dev.ccpocket.app 被旧 Apple 账号占用（bundle ID 跨 team 全局唯一），换账号后改用此 ID
        PRODUCT_BUNDLE_IDENTIFIER: com.panda.ccpocket
        PRODUCT_NAME: cc-pocket
        CODE_SIGN_STYLE: Automatic
        # CI regenerates the project: preserve the APNs capability from the local .xcodeproj.
        # Xcode selects development/production when signing with the corresponding profile.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        DEVELOPMENT_TEAM: SC9S2SJ42G  # 当前账号 team；写进来让 xcodegen generate 后不用重选
        INFOPLIST_FILE: iosApp/Info.plist
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Universal (iPhone + iPad) since #334. This value is COUPLED to Info.plist and may not be changed
        # alone. The app does not set UIRequiresFullScreen (deprecated, TN3192), so on iPad it takes part in
        # multitasking and lays itself out for whatever window it gets. A universal build that supports
        # multitasking must declare all four iPad orientations (UISupportedInterfaceOrientations~ipad) and a
        # launch storyboard (UILaunchStoryboardName); App Store validation rejects it otherwise, which is
        # exactly how the earlier universal attempt failed (ecf881ff) and why this was pinned back to "1".
        # iPhone stays Portrait-only via the unsuffixed UISupportedInterfaceOrientations. The committed
        # .xcodeproj carries the same value; declaring it here keeps the CI-regenerated project in sync.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../mobile/composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Xcode 的构建环境 PATH 里通常没有 java；显式指定，避免 gradlew 启动失败
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17}"
          cd "$SRCROOT/.."
          ./gradlew :mobile:composeApp:embedAndSignAppleFrameworkForXcode
